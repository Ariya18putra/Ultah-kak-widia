                                <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yazstore - Katalog Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue-dora: #00A0E9;
            --blue-dark: #007bb5;
            --yellow-nobi: #FFD200;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f4f7f9;
            margin: 0; padding: 0;
        }

        header {
            background: linear-gradient(135deg, var(--blue-dora), var(--blue-dark));
            color: white; padding: 40px 20px; text-align: center;
            border-bottom: 6px solid var(--yellow-nobi);
        }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }

        .card {
            background: white; border-radius: 20px; padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05); border: 2px solid transparent;
            display: flex; flex-direction: column; transition: 0.3s;
        }

        .card:hover { border-color: var(--blue-dora); transform: translateY(-5px); }
        .card h3 { margin: 0 0 15px; color: var(--blue-dark); font-size: 1.1rem; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }

        select { width: 100%; padding: 10px; border-radius: 10px; border: 2px solid #f0f0f0; margin-bottom: 15px; font-family: inherit; }

        .btn-order {
            background: var(--blue-dora); color: white; border: none;
            padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer;
        }

        /* MODAL PEMBAYARAN */
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white; width: 90%; max-width: 420px; margin: 20px auto;
            padding: 25px; border-radius: 25px; text-align: center; border: 4px solid var(--blue-dora);
            max-height: 90vh; overflow-y: auto; /* Agar bisa di-scroll di HP kecil */
        }

        .modal-content img { width: 100%; border-radius: 15px; margin: 15px 0; border: 1px solid #ddd; }

        .fee-info {
            background: #fff1f1; color: #d32f2f; padding: 10px; border-radius: 10px;
            font-weight: 800; margin-bottom: 15px; font-size: 0.9rem; border: 1px solid #ffcccc;
        }

        /* TOMBOL WHATSAPP YANG HILANG TADI */
        .wa-btn {
            display: block !important; /* Memastikan tombol muncul */
            background: #25D366 !important;
            color: white !important;
            text-decoration: none !important;
            padding: 16px !important;
            border-radius: 15px !important;
            font-weight: 800 !important;
            font-size: 1.1rem !important;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            margin: 10px 0 20px 0;
            transition: 0.3s;
        }

        .wa-btn:hover { background: #1ebd59 !important; transform: scale(1.02); }

        .close-link { display: block; margin-top: 10px; color: #aaa; cursor: pointer; font-size: 0.8rem; text-decoration: underline; }

        footer { text-align: center; padding: 50px; color: #aaa; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1>YAZSTORE</h1>
    <p>Premium Account • Hosting • Digital Services</p>
</header>

<div class="container">
    <div class="grid" id="productGrid">
        </div>
</div>

<div id="paymentModal" class="modal">
    <div class="modal-content">
        <h2 style="color: var(--blue-dora); margin: 0; font-size: 1.5rem;">PEMBAYARAN</h2>
        <p id="desc" style="font-weight: 800; color: #333; margin: 10px 0;"></p>
        
        <img src="https://autoresbot.com/tmp_files/7e8fe096-7664-4af2-949e-844f0e34e4a7.jpg" alt="QRIS Yazstore">
        
        <div class="fee-info">
            FEE QRIS +50 PERAK (WAJIB)<br>
            NO FEE = TIDAK DIPROSES
        </div>

        <a href="#" id="waLink" class="wa-btn">KIRIM BUKTI TRANSFER</a>
        
        <span class="close-link" onclick="closeModal()">Kembali ke Katalog</span>
    </div>
</div>

<script>
    // List 17 Produk Kamu
    const apps = [
        { n: "📢 Jasa Promosi (JPM)", id: "jpm", v: ["3 Hari|3K", "1 Minggu|5K"] },
        { n: "🤖 Sewa Bot Grub", id: "bot", v: ["1 Minggu|3K", "1 Bulan|10K"] },
        { n: "🖥️ Panel Pterodactyl", id: "pnl", v: ["1 GB|5K", "5 GB|15K", "Unlimited|25K"] },
        { n: "📱 Nokos WhatsApp", id: "nks", v: ["No Garansi|5K"] },
        { n: "🌐 VPN Bulanan", id: "vpn", v: ["Express|12K", "HMA|10K", "Surfshark|20K"] },
        { n: "🎨 Canva Pro", id: "cnv", v: ["1 Bulan|3K", "Lifetime|15K"] },
        { n: "🎬 Capcut Private", id: "cpt", v: ["1 Minggu|2K", "2 Minggu|3K", "1 Bulan|5K"] },
        { n: "📽️ AM Private", id: "am", v: ["1 Tahun Private|3K"] },
        { n: "🧠 Gemini AI", id: "gmn", v: ["1 Bulan|5K"] },
        { n: "💬 ChatGPT Private", id: "gpt", v: ["1 Bulan|17K"] },
        { n: "🎥 Youtube Invite", id: "yt", v: ["1 Bulan|5K"] },
        { n: "🎵 Spotify Private", id: "spt", v: ["1 Bulan|20K"] },
        { n: "🍿 Netflix Bulanan", id: "nfx", v: ["1p1u|25K", "1p2u|15K", "Semi Private|30K"] },
        { n: "🍱 Viu Generator", id: "viu", v: ["1 Tahun Private|3K"] },
        { n: "📞 Zoom Private", id: "zm", v: ["2 Minggu|5K"] },
        { n: "📚 Scribd Private", id: "scb", v: ["1 Bulan|10K"] },
        { n: "💼 Microsoft 365", id: "ms", v: ["Famplan|10K", "Famhead|15K", "Indplan|17K"] }
    ];

    // Generate Card Otomatis
    const grid = document.getElementById('productGrid');
    apps.forEach(app => {
        let options = app.v.map(opt => `<option value="${opt}">${opt.replace('|', ' - ')}</option>`).join('');
        grid.innerHTML += `
            <div class="card">
                <h3>${app.n}</h3>
                <select id="${app.id}">${options}</select>
                <button class="btn-order" onclick="pay('${app.n}', '${app.id}')">BELI SEKARANG</button>
            </div>
        `;
    });

    function pay(nama, id) {
        const sel = document.getElementById(id);
        const [ver, hrg] = sel.value.split('|');
        
        document.getElementById('desc').innerText = `${nama} (${ver}) — ${hrg}`;
        
        const wa = "6285647652481";
        const msg = `Halo Admin Yazstore,%0A%0ASaya ingin membeli:%0AProduk: ${nama}%0AVersi: ${ver}%0AJumlah: 1%0AHarga: ${hrg}%0A%0ASaya sudah transfer via QRIS. Mohon segera diproses!`;
        
        // Update Link WA
        document.getElementById('waLink').href = `https://wa.me/${wa}?text=${msg}`;
        
        // Tampilkan Modal
        document.getElementById('paymentModal').style.display = "block";
    }

    function closeModal() {
        document.getElementById('paymentModal').style.display = "none";
    }

    // Tutup modal jika klik di luar kotak
    window.onclick = function(e) {
        if (e.target == document.getElementById('paymentModal')) closeModal();
    }
</script>

</body>
</html>
